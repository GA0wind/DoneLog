buildscript {
    dependencies {
        classpath files("${project.property('dcloudSdk')}/plugins/uts-kotlin-compiler-plugin-0.0.1.jar")
        classpath files("${project.property('dcloudSdk')}/plugins/uts-kotlin-gradle-plugin-0.0.1.jar")
    }
}
plugins {
    id 'com.android.application' version '8.12.0' apply false
    id 'com.android.library' version '8.12.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.0' apply false
}
ext.dcloudAars = [
    'uts-runtime-release.aar', 'android-gif-drawable-1.2.30.aar',
    'app-common-release.aar', 'app-runtime-release.aar', 'breakpad-build-release.aar',
    'dcloud-layout-release.aar', 'framework-release.aar', 'uni-exit-release.aar',
    'uni-getAccessibilityInfo-release.aar', 'uni-getAppAuthorizeSetting-release.aar',
    'uni-getAppBaseInfo-release.aar', 'uni-getSystemSetting-release.aar',
    'uni-openAppAuthorizeSetting-release.aar', 'uni-prompt-release.aar', 'uni-storage-release.aar',
    'uni-getDeviceInfo-release.aar', 'uni-getSystemInfo-release.aar', 'uni-rpx2px-release.aar',
    'uni-theme-release.aar', 'uni-convert2AbsFullPath-release.aar',
    'uni-clipboard-release.aar', 'uni-modal-release.aar', 'uni-picker-release.aar',
    'uni-actionSheet-release.aar'
].collect { file("${project.property('dcloudSdk')}/SDK/libs/${it}") }
